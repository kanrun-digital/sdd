name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # check_version_bump.py diffs against the base ref

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate plugin (name / version / description + skill & agent frontmatter)
        run: python3 scripts/validate_plugin.py

      - name: Version bump accompanies a skills/agents change
        run: |
          # On a PR the base is the target branch; on a push to main it is the previous commit.
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            python3 scripts/check_version_bump.py "origin/${{ github.base_ref }}"
          else
            python3 scripts/check_version_bump.py
          fi

      - name: No references to excluded legacy dirs
        run: |
          if grep -REn '00-overview|document-templates|examples/|scripts/sdlc_lint|generate-gates' skills agents README.md 2>/dev/null; then
            echo "FAIL: found a reference to an excluded legacy dir/file"; exit 1
          fi
          echo "OK: no excluded-dir references"

      - name: Lint install.sh
        run: |
          bash -n install.sh
          shellcheck install.sh
          bash -s -- --help < install.sh | grep -q 'install.sh <codex|cursor|claude>'
          if bash -s -- codex --prefix < install.sh 2>installer-error.txt; then
            echo "FAIL: missing --prefix value unexpectedly succeeded"; exit 1
          fi
          grep -q 'error: --prefix needs a directory' installer-error.txt
          if bash -s -- codex --prefix --global < install.sh 2>installer-error.txt; then
            echo "FAIL: option token was accepted as a --prefix value"; exit 1
          fi
          grep -q "error: --prefix needs a directory" installer-error.txt

  # deterministic runtime tests for the dashboard MCP server (state derivation,
  # path-security boundary, command allowlist) — no network, committed fixtures.
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test tests/

  # matrix incl. macos-latest: BSD sed/find/wc differ from GNU — a cheap guard against
  # installer regressions that only bite on a Mac.
  smoke-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"   # tomllib needs 3.11+; macos system python can be older

      - name: Smoke-install codex + cursor (install → assert → re-run → uninstall)
        shell: bash
        run: |
          set -x
          # counts come from the source tree, not hardcoded — adding a skill/agent must not
          # require touching this workflow
          n_skills=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -dc '0-9')
          n_agents=$(find agents -maxdepth 1 -name '*.md' | wc -l | tr -dc '0-9')
          test "$n_skills" -ge 16 && test "$n_agents" -ge 9
          for tool in codex cursor; do
            prefix=$(mktemp -d)
            ./install.sh "$tool" --src . --prefix "$prefix"
            case "$tool" in
              codex)  skills="$prefix/.agents/skills"; agents="$prefix/.codex/agents" ;;
              cursor) skills="$prefix/.cursor/skills"; agents="$prefix/.cursor/agents" ;;
            esac
            # the subtree is verbatim: skills renamed sdd-*, _shared + agents docs intact
            grep -q '^name: sdd-specify$' "$skills/sdd/skills/specify/SKILL.md"
            test "$(grep -rl '^name: sdd-' "$skills"/sdd/skills/*/SKILL.md | wc -l | tr -dc '0-9')" -eq "$n_skills"
            test -f "$skills/sdd/skills/_shared/handoff.md"
            test -f "$skills/sdd/skills/_shared/tool-adapters.md"
            test -f "$skills/sdd/agents/reviewer.md"
            if [ "$tool" = codex ]; then
              # every generated agent TOML parses; sandbox follows the tools declaration
              python3 - "$agents" "$n_agents" agents <<'EOF'
          import re, sys, tomllib
          from pathlib import Path
          files = sorted(Path(sys.argv[1]).glob("sdd-*.toml"))
          assert len(files) == int(sys.argv[2]), files
          for f in files:
              d = tomllib.load(open(f, "rb"))
              assert d["name"] == f.stem and d["description"] and d["developer_instructions"], f
              want = "workspace-write" if f.stem in ("sdd-implementer", "sdd-test-author") else "read-only"
              assert d["sandbox_mode"] == want, (f.name, d["sandbox_mode"])
              source = Path(sys.argv[3], f.stem.removeprefix("sdd-") + ".md").read_text()
              effort = re.search(r"^effort:\s*(\S+)\s*$", source, re.MULTILINE).group(1)
              assert d["model_reasoning_effort"] == effort, (f.name, d["model_reasoning_effort"], effort)
          print(f"{len(files)} agent TOMLs OK")
          EOF
            else
              grep -q '^name: sdd-reviewer$' "$agents/sdd-reviewer.md"
              grep -q '^model: inherit$' "$agents/sdd-reviewer.md"
              test "$(ls "$agents"/sdd-*.md | wc -l | tr -dc '0-9')" -eq "$n_agents"
            fi
            # idempotency: a second run cleans first and converges to the same layout
            ./install.sh "$tool" --src . --prefix "$prefix"
            grep -q '^name: sdd-specify$' "$skills/sdd/skills/specify/SKILL.md"
            # upgrade over the pre-v1.9.0 FLAT layout: ours goes, everything else stays
            mkdir -p "$skills/sdd-specify" "$skills/sdd-shared" "$skills/sdd-foreign" \
                     "$skills/sdd-empty" "$skills/lazybird-api"
            printf -- '---\nname: sdd-specify\ndescription: stale copy\n---\n' > "$skills/sdd-specify/SKILL.md"
            printf -- '---\nname: foreign-thing\ndescription: a user skill\n---\n' > "$skills/sdd-foreign/SKILL.md"
            printf -- '---\nname: lazybird-api\ndescription: unrelated\n---\n' > "$skills/lazybird-api/SKILL.md"
            cp skills/_shared/tool-adapters.md "$skills/sdd-shared/tool-adapters.md"
            ./install.sh "$tool" --src . --prefix "$prefix"
            for gone in sdd-specify sdd-shared; do
              test ! -e "$skills/$gone" || { echo "FAIL: legacy flat $gone survived the upgrade"; exit 1; }
            done
            for kept in sdd-foreign/SKILL.md sdd-empty lazybird-api/SKILL.md; do
              test -e "$skills/$kept" || { echo "FAIL: installer deleted unattributable $kept"; exit 1; }
            done
            grep -q '^name: sdd-specify$' "$skills/sdd/skills/specify/SKILL.md"
            rm -rf "$skills/sdd-foreign" "$skills/sdd-empty" "$skills/lazybird-api"
            # a bad source or mid-build failure must preserve the previous complete install
            before_skill=$(cksum "$skills/sdd/skills/specify/SKILL.md")
            if ./install.sh "$tool" --src "$prefix/does-not-exist" --prefix "$prefix"; then
              echo "FAIL: install.sh succeeded on a missing source"; exit 1
            fi
            test "$(cksum "$skills/sdd/skills/specify/SKILL.md")" = "$before_skill" \
              || { echo "FAIL: source validation failure damaged the working install"; exit 1; }
            mkdir "$prefix/broken-src" && cp -R skills agents "$prefix/broken-src/"
            sed_i() { if sed --version >/dev/null 2>&1; then sed -i "$@"; else sed -i '' "$@"; fi; }
            sed_i 's/^name: design$/name: broken-on-purpose/' "$prefix/broken-src/skills/design/SKILL.md"
            if ./install.sh "$tool" --src "$prefix/broken-src" --prefix "$prefix"; then
              echo "FAIL: install.sh succeeded on a broken source"; exit 1
            fi
            test "$(cksum "$skills/sdd/skills/specify/SKILL.md")" = "$before_skill" \
              || { echo "FAIL: failed replacement did not preserve the previous install"; exit 1; }
            # a fresh prefix still stays empty on failure
            empty_prefix=$(mktemp -d)
            if ./install.sh "$tool" --src "$prefix/broken-src" --prefix "$empty_prefix"; then
              echo "FAIL: broken source installed into a fresh prefix"; exit 1
            fi
            case "$tool" in
              codex)  test ! -e "$empty_prefix/.agents/skills/sdd" ;;
              cursor) test ! -e "$empty_prefix/.cursor/skills/sdd" ;;
            esac
            # re-run the good tree, then uninstall leaves the prefix clean
            ./install.sh "$tool" --src . --prefix "$prefix"
            ./install.sh "$tool" --prefix "$prefix" --uninstall
            test ! -e "$skills/sdd"
            if ls "$agents"/sdd-* 2>/dev/null; then echo "FAIL: agents not removed"; exit 1; fi
          done

          # Global Codex installs keep user skills in ~/.agents/skills, while custom
          # agents follow CODEX_HOME when it is explicitly redirected.
          global_home=$(mktemp -d)
          custom_codex_home=$(mktemp -d)
          HOME="$global_home" CODEX_HOME="$custom_codex_home" \
            ./install.sh codex --src . --global
          test -f "$global_home/.agents/skills/sdd/skills/specify/SKILL.md"
          test -f "$custom_codex_home/agents/sdd-reviewer.toml"
          HOME="$global_home" CODEX_HOME="$custom_codex_home" \
            ./install.sh codex --global --uninstall
          test ! -e "$global_home/.agents/skills/sdd"
          if ls "$custom_codex_home"/agents/sdd-* 2>/dev/null; then
            echo "FAIL: CODEX_HOME agents not removed"; exit 1
          fi
